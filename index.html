<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Just a Calculator</title>
  <meta name="description" content="Just a Calculator. Available on the App Store and Google Play.">
  <meta name="theme-color" content="#111111">

  <meta property="og:title" content="Just a Calculator">
  <meta property="og:description" content="Available on the App Store and Google Play.">
  <meta property="og:type" content="website">

  <!-- Smart App Banner for Safari on iOS -->
  <meta name="apple-itunes-app" content="app-id=6804248023">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>
    @font-face {
      font-family: "CalcDigit";
      src: url("assets/calcdigit.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --bg: #0b0b0c;
      --panel: #161618;
      --key: #2c2c2e;
      --key-light: #a5a5a5;
      --accent: #ff9f0a;
      --text: #f5f5f7;
      --muted: #8e8e93;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #1c1c1f 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "CalcDigit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    main {
      width: 100%;
      max-width: 880px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 56px;
      align-items: center;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin: 0 0 16px;
      font-weight: 700;
    }

    h1 span { color: var(--accent); }

    .tagline {
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.5;
      margin: 0 0 32px;
      max-width: 34ch;
    }

    .stores {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .store {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 190px;
      padding: 10px 20px 10px 16px;
      border-radius: 14px;
      background: #000;
      border: 1px solid #3a3a3c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .store:hover { transform: translateY(-2px); border-color: #636366; }
    .store:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .store.recommended { border-color: var(--accent); }

    .store svg { width: 28px; height: 28px; flex: none; }

    .store small {
      display: block;
      font-size: .7rem;
      letter-spacing: .02em;
      opacity: .85;
    }

    .store strong {
      display: block;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }

    .note {
      margin-top: 20px;
      font-size: .85rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    /* Trailer (vertical YouTube Short) */
    .trailer {
      width: 300px;
      aspect-ratio: 9 / 16;
      border-radius: 28px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    }

    .trailer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    footer {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 0; right: 0;
      text-align: center;
      font-size: .78rem;
      color: #5a5a5e;
    }

    @media (max-width: 720px) {
      main {
        grid-template-columns: 1fr;
        gap: 40px;
        text-align: center;
      }
      .tagline { margin-left: auto; margin-right: auto; }
      .stores { justify-content: center; }
      .trailer { order: -1; margin: 0 auto; width: min(260px, 70vw); border-radius: 24px; }
      footer { position: static; margin-top: 32px; }
      body { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .store { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Just a<br><span>Calculator.</span></h1>
      <p class="tagline">Nothing more. Nothing less. Maybe.<br>Download it now.</p>

      <div class="stores">
        <a class="store" id="ios" href="https://apps.apple.com/us/app/just-a-calculator/id6804248023" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16.37 12.62c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.89 1.15 9.14.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.77-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.39-.92-2.41-3.66zM14.1 5.86c.63-.77 1.06-1.83.94-2.89-.91.04-2.01.61-2.66 1.37-.58.67-1.09 1.75-.96 2.79 1.02.08 2.05-.52 2.68-1.27z"/>
          </svg>
          <span><small>Download on the</small><strong>App Store</strong></span>
        </a>

        <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.fictioncutshort.justacalculator" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#00d7fe" d="M3.6 1.8c-.3.3-.4.7-.4 1.2v18c0 .5.2.9.4 1.2l.1.1L13.8 12.2v-.2L3.7 1.7l-.1.1z"/>
            <path fill="#ffce00" d="M17.2 15.6l-3.4-3.4v-.2l3.4-3.4.1.1 4 2.3c1.1.6 1.1 1.7 0 2.4l-4 2.3-.1-.1z"/>
            <path fill="#ff3a44" d="M17.3 15.5L13.8 12 3.6 22.2c.4.4 1 .4 1.7.1l12-6.8"/>
            <path fill="#00f076" d="M17.3 8.5L5.3 1.7c-.7-.4-1.3-.3-1.7.1L13.8 12l3.5-3.5z"/>
          </svg>
          <span><small>GET IT ON</small><strong>Google Play</strong></span>
        </a>
      </div>

      <p class="note" id="note" aria-live="polite"></p>
    </section>

    <div class="trailer">
      <iframe
        src="https://www.youtube-nocookie.com/embed/xQvxtRRD4m0?autoplay=1&mute=1&loop=1&playlist=xQvxtRRD4m0&playsinline=1&rel=0&modestbranding=1"
        title="Just a Calculator trailer"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
        loading="eager"></iframe>
    </div>
  </main>

  <footer>&copy; <span id="year"></span> Just a Calculator</footer>

  <script>
    (function () {
      var APP_STORE = document.getElementById('ios').href;
      var PLAY_STORE = document.getElementById('android').href;

      document.getElementById('year').textContent = new Date().getFullYear();

      var ua = navigator.userAgent || '';
      // iPadOS 13+ reports itself as a Mac, so also check for touch support.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                  (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      // Add ?stay to the URL to view the page on a phone without being redirected.
      var stay = /[?&]stay\b/.test(location.search);

      var target = isIOS ? APP_STORE : isAndroid ? PLAY_STORE : null;
      var note = document.getElementById('note');

      if (target) {
        document.getElementById(isIOS ? 'ios' : 'android').classList.add('recommended');
        if (!stay) {
          note.textContent = 'Taking you to the ' + (isIOS ? 'App Store' : 'Google Play Store') + '…';
          // replace() so the back button doesn't bounce the user back into the redirect.
          setTimeout(function () { location.replace(target); }, 600);
        }
      }
    })();
  </script>
</body>
</html>
